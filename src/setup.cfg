# mutmut configuration for the progon kind `pymutation` (.progon/api.toml).
# The parts of the monitor runner (internal/monitorassets/runner/) are
# mutated; their unittest files (*_test.py under runner_tests/) are collected
# by pytest, which mutmut drives. The tests, their harness, the registry the
# harness embeds into the body and the test interpreter hooks are copied, not
# mutated. The bootstrap loader (internal/mcp/tools/assets/) and the client
# loader (internal/monitorassets/loader_client/, whose parts.txt the harness
# reads to assemble the served loader) are copied too, not mutated: the tests
# run them only as subprocesses (python3 <file>), where mutmut does not
# attribute a killed mutant to a test.
[mutmut]
source_paths =
    internal/monitorassets/runner/
also_copy =
    internal/handler/assets/runner_tests/
    internal/handler/testdata/
    internal/monitorregistry/
    internal/mcp/tools/assets/
    internal/monitorassets/loader_client/
# The test files that run the runner, the loader, the starter or prepare
# only as subprocesses are not collected: mutmut credits no mutant to them,
# and they cost the stats and every mutant's run.
pytest_add_cli_args =
    -o
    python_files=*_test.py
    --ignore=internal/handler/assets/runner_tests/compat_py36_test.py
    --ignore=internal/handler/assets/runner_tests/starter_test.py
    --ignore=internal/handler/assets/runner_tests/starter_py36_test.py
    --ignore=internal/handler/assets/runner_tests/prepare_windows_test.py
pytest_add_cli_args_test_selection =
    internal/handler/assets/runner_tests/
