# mutmut configuration for the progon kind `pymutation` (.progon/api.toml).
# The monitor runner is mutated; its unittest files (*_test.py) are collected
# by pytest, which mutmut drives. The bootstrap loader is copied, not mutated:
# its tests pass the file to `python3 -c` as one argument, and with mutmut's
# trampolines it exceeds the kernel's limit on the length of one argument.
[mutmut]
source_paths =
    internal/handler/assets/
do_not_mutate =
    *_test.py
also_copy =
    internal/handler/testdata/
    internal/mcp/tools/assets/
pytest_add_cli_args =
    -o
    python_files=*_test.py
pytest_add_cli_args_test_selection =
    internal/handler/assets/
