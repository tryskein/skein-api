# mutmut configuration for the progon kind `pymutation` (.progon/api.toml).
# The parts of the monitor runner (internal/handler/assets/runner/) are
# mutated; their unittest files (*_test.py under runner_tests/) are collected
# by pytest, which mutmut drives. The tests, their harness, the registry the
# harness embeds into the body and the test interpreter hooks are copied, not
# mutated. The bootstrap loader is copied too: its tests pass the file to
# `python3 -c` as one argument, and with mutmut's trampolines it exceeds the
# kernel's limit on the length of one argument.
[mutmut]
source_paths =
    internal/handler/assets/runner/
also_copy =
    internal/handler/assets/runner_tests/
    internal/handler/testdata/
    internal/monitorregistry/
    internal/mcp/tools/assets/
pytest_add_cli_args =
    -o
    python_files=*_test.py
pytest_add_cli_args_test_selection =
    internal/handler/assets/runner_tests/
