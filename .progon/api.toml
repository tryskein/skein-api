schema = 1
root = ".."

# A part of pymutation needs more than the default 2 h (kind.pymutation).
[limits]
max_timeout_seconds = 14400

[defaults]
adapter = "go"
image = "golang:1.27"
prepare_image = true
network = "grant"
workdir = "src"
cpu = 2
memory_mib = 2048

[defaults.env]
CGO_ENABLED = "0"
GOFLAGS = "-buildvcs=false"

# Go tests without a database: DB-backed tests skip without TEST_DATABASE_URL.
# python3 is installed on top of the Go image: the Go tests that execute the
# served monitor runner skip without it.
[kind.unit]
image_setup = [
  "apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*",
]
[kind.unit.options]
flags = ["-count=1"]

# Store, handler and MCP tests against a migrated Postgres (pg_trgm + vector).
# One shared database: packages must run serially (-p 1).
[kind.integ]
memory_mib = 3072
image_setup = [
  "apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*",
]
timeout_seconds = 3600
test_timeout_seconds = 900
prepare = [
  "go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1",
  "\"$(go env GOPATH)/bin/migrate\" -path migrations -database \"$TEST_DATABASE_URL\" up",
]
[kind.integ.env]
TEST_DATABASE_URL = "postgres://skein:test@pg:5432/skein?sslmode=disable"
[kind.integ.options]
parallel = 1
flags = ["-count=1"]
[[kind.integ.fixture]]
name = "pg"
image = "pgvector/pgvector:pg18"
pull = true
cpu = 1
memory_mib = 2048
tmpfs = ["/var/lib/postgresql/data"]
ready = ["pg_isready", "-U", "skein", "-d", "skein", "-h", "127.0.0.1"]
init = [
  ["psql", "-v", "ON_ERROR_STOP=1", "-U", "skein", "-d", "skein", "-c", "CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS vector;"],
]
[kind.integ.fixture.env]
POSTGRES_USER = "skein"
POSTGRES_PASSWORD = "test"
POSTGRES_DB = "skein"
PGDATA = "/var/lib/postgresql/data/pgdata"
POSTGRES_INITDB_ARGS = "--locale-provider=builtin --builtin-locale=C.UTF-8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"

# Mutation testing with gomutants (needs Go 1.26+). One worker at a time:
# the packages are not safe to mutate in parallel. The same Postgres fixture
# and migrations as integ, so DB-backed tests take part in the measurement.
# No incremental state: gomutants keys its cached coverage on the Go inputs
# only, not on TEST_DATABASE_URL, so a cache filled while DB-backed tests
# skipped would mark the lines only they reach as not covered.
[kind.mutation]
adapter = "gomutants"
incremental = false
prepare = [
  "go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1",
  "\"$(go env GOPATH)/bin/migrate\" -path migrations -database \"$TEST_DATABASE_URL\" up",
]
cpu = 4
memory_mib = 4096
timeout_seconds = 7200
[kind.mutation.env]
GOFLAGS = "-buildvcs=false -p=1"
TEST_DATABASE_URL = "postgres://skein:test@pg:5432/skein?sslmode=disable"
[kind.mutation.options]
workers = 1
[[kind.mutation.fixture]]
name = "pg"
image = "pgvector/pgvector:pg18"
pull = true
cpu = 1
memory_mib = 2048
tmpfs = ["/var/lib/postgresql/data"]
ready = ["pg_isready", "-U", "skein", "-d", "skein", "-h", "127.0.0.1"]
init = [
  ["psql", "-v", "ON_ERROR_STOP=1", "-U", "skein", "-d", "skein", "-c", "CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS vector;"],
]
[kind.mutation.fixture.env]
POSTGRES_USER = "skein"
POSTGRES_PASSWORD = "test"
POSTGRES_DB = "skein"
PGDATA = "/var/lib/postgresql/data/pgdata"
POSTGRES_INITDB_ARGS = "--locale-provider=builtin --builtin-locale=C.UTF-8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"

# Python tests of the monitor runner and loader (stdlib unittest): every
# *_test.py under src runs on its own with `python3 <file> -v`. Narrowed run:
# a path relative to src.
[kind.pyunit]
adapter = "python"
image = "python:3.13.18-slim-bookworm"
[kind.pyunit.options]
mode = "unittest-files"
start = "."
pattern = "*_test.py"

# The same Python tests on the lowest Python of POSIX (R-9): only the
# *_py36_test.py files, written on the stdlib of Python 3.6, under a 3.6
# image. Narrowed run: a path relative to src.
[kind.pyunit36]
adapter = "python"
image = "python:3.6.15-slim-bullseye"
[kind.pyunit36.options]
mode = "unittest-files"
start = "."
pattern = "*_py36_test.py"

# Mutation testing of the Python runner with mutmut (only the runner is
# mutated; the loader is copied for its tests); its
# configuration (what is mutated, which tests run) is the [mutmut] section of
# src/setup.cfg. Targets are mutant name patterns, e.g.
# "internal.monitorassets.runner.core.x_build_url*"; mutmut has no diff mode.
[kind.pymutation]
adapter = "mutmut"
image = "python:3.13.18-slim-bookworm"
# Before its first mutant a part runs the stats and the clean run over the
# whole collection, so a part outlasts the default 2 h.
cpu = 8
memory_mib = 16384
timeout_seconds = 14400
[kind.pymutation.options]
install = "python3 -m pip install --user mutmut==3.8.1"

# The monitor starter under Python 2.7 (R-9): scripts/progon/starter-py27.sh
# runs both modes of the starter with python2.7 and prints TAP; an old
# interpreter must get the stop line config_invalid, not a SyntaxError. Run
# from the repository root.
[kind.py27]
adapter = "shell"
image = "python:2.7.18-slim-buster"
workdir = "."
[kind.py27.selection]
default = ["scripts/progon/starter-py27.sh"]

# Size measurements of the MCP surface: scripts/progon/measure.sh runs
# scripts/measure-tools-list.sh and scripts/measure-tool-responses.sh and
# prints MEASURE_* lines. Run from the repository root (the scripts address
# src/ themselves); the response measurement needs the same migrated
# Postgres as integ.
[kind.measure]
adapter = "shell"
workdir = "."
# python3 runs `prepare` and builds the runner's working command (SC-012).
image_setup = [
  "apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*",
]
memory_mib = 3072
timeout_seconds = 3600
test_timeout_seconds = 1800
prepare = [
  "go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1",
  "\"$(go env GOPATH)/bin/migrate\" -path src/migrations -database \"$TEST_DATABASE_URL\" up",
]
[kind.measure.env]
TEST_DATABASE_URL = "postgres://skein:test@pg:5432/skein?sslmode=disable"
[kind.measure.options]
shell = ["bash"]
[kind.measure.selection]
default = ["scripts/progon/measure.sh"]
[[kind.measure.fixture]]
name = "pg"
image = "pgvector/pgvector:pg18"
pull = true
cpu = 1
memory_mib = 2048
tmpfs = ["/var/lib/postgresql/data"]
ready = ["pg_isready", "-U", "skein", "-d", "skein", "-h", "127.0.0.1"]
init = [
  ["psql", "-v", "ON_ERROR_STOP=1", "-U", "skein", "-d", "skein", "-c", "CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS vector;"],
]
[kind.measure.fixture.env]
POSTGRES_USER = "skein"
POSTGRES_PASSWORD = "test"
POSTGRES_DB = "skein"
PGDATA = "/var/lib/postgresql/data/pgdata"
POSTGRES_INITDB_ARGS = "--locale-provider=builtin --builtin-locale=C.UTF-8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"
